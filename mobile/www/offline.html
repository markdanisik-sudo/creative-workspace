<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>m.studio.lab</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ecebe8;
        --text: #0b0b0b;
        --muted: #77766f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e0e0d;
          --text: #f4f4f4;
          --muted: #8c8c8c;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.4 -apple-system,
          BlinkMacSystemFont,
          "Inter",
          sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0 0 6px;
      }
      p {
        color: var(--muted);
        margin: 0 0 20px;
      }
      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 999px;
        padding: 12px 22px;
        background: var(--text);
        color: var(--bg);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Jste offline</h1>
      <p>m.studio.lab potřebuje připojení k internetu.</p>
      <button onclick="location.replace('https://mstudiolab.vercel.app')">Zkusit znovu</button>
    </main>
  </body>
</html>
